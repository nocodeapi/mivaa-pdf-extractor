name: Deploy FastAPI App with uv

on:
  push:
    branches: [ "main", "production"]       # deploy when main or production is updated
  workflow_dispatch:                        # allow manual trigger

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production                 # <-- ensures environment secrets are available

    steps:
    # 1. Checkout the repository
    - name: Checkout repository
      uses: actions/checkout@v4

    # 2. Load the private SSH key to connect to the server
    - name: Setup SSH
      uses: webfactory/ssh-agent@v0.9.0
      with:
        ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

    # 3. Deploy the application
    - name: Deploy to server
      run: |
        ssh -o StrictHostKeyChecking=no root@104.248.190.55 << 'EOF'
          set -e

          # Clone the repo if it doesn't exist
          cd /var/www/mivaa-pdf-extractor || {
            git clone git@github.com:nocodeapi/mivaa-pdf-extractor.git /var/www/mivaa-pdf-extractor
            cd /var/www/mivaa-pdf-extractor
          }
          git pull origin main

          # Write environment variables to .env
          cat > .env <<EOL
          SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_URL=${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY=${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}
          OPENAI_ORG_ID=${{ secrets.OPENAI_ORG_ID }}
          OPENAI_PROJECT_ID=${{ secrets.OPENAI_PROJECT_ID }}
          ANTHROPIC_API_KEY=${{ secrets.ANTHROPIC_API_KEY }}
          HUGGINGFACE_API_TOKEN=${{ secrets.HUGGINGFACE_API_TOKEN }}
          HUGGING_FACE_ACCESS_TOKEN=${{ secrets.HUGGING_FACE_ACCESS_TOKEN }}
          GITHUB_REPOSITORY=${{ secrets.GITHUB_REPOSITORY }}
          IMAGE_TAG=${{ secrets.IMAGE_TAG }}
          EOL

          # Install or update dependencies using uv
          uv sync --frozen

          # Restart the FastAPI service (systemd unit must already exist)
          sudo systemctl restart mivaa-pdf-extractor
        EOF
