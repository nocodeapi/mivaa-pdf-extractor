name: Deploy FastAPI App with uv

on:
  push:
    branches: [ "main", "production"]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      # 1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Setup SSH
      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      # 3. Deploy to server
      - name: Deploy to server
        run: |
          ssh -o StrictHostKeyChecking=no root@104.248.190.55 << 'EOF'
          set -e

          APP_DIR=/var/www/mivaa-pdf-extractor
          DEPLOY_BRANCH="${{ github.ref_name }}"

          # Clone repo if it doesn't exist
          if [ ! -d "$APP_DIR/.git" ]; then
            rm -rf "$APP_DIR"
            git clone https://x-access-token:${{ secrets.GH_PAT }}@github.com/nocodeapi/mivaa-pdf-extractor.git "$APP_DIR"
          fi

          cd "$APP_DIR"

          # Pull latest changes for the branch
          git fetch origin "$DEPLOY_BRANCH"
          git reset --hard origin/"$DEPLOY_BRANCH"

          # --- Initialize pyenv if needed ---
          export PATH="$HOME/.pyenv/bin:$PATH"
          if command -v pyenv >/dev/null 2>&1; then
            eval "$(pyenv init --path)"
            eval "$(pyenv init -)"
            eval "$(pyenv virtualenv-init -)"
          fi

          # Use system Python 3.9+ or pyenv Python
          PYTHON=python3

          # --- Create virtual environment ---
          if [ ! -d ".venv" ] || [ ! -f ".venv/pyvenv.cfg" ]; then
            echo "Creating virtual environment..."
            rm -rf .venv
            $PYTHON -m venv .venv
          fi

          # Activate venv
          source .venv/bin/activate
          echo "Python version in venv: $($PYTHON --version)"

          # --- Install uv in venv ---
          $PYTHON -m pip install --upgrade pip
          $PYTHON -m pip install uv

          # --- Sync dependencies using uv.lock ---
          $PYTHON -m uv pip sync uv.lock

          # --- Verify key packages ---
          $PYTHON -c "import fastapi; print('FastAPI OK')"
          $PYTHON -c "import pymupdf; print(f'PyMuPDF {pymupdf.__version__} OK')"
          $PYTHON -c "import pymupdf4llm; print('pymupdf4llm OK')"

          # --- Write environment variables ---
          cat > .env <<EOL
          SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_URL=${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY=${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}
          OPENAI_ORG_ID=${{ secrets.OPENAI_ORG_ID }}
          OPENAI_PROJECT_ID=${{ secrets.OPENAI_PROJECT_ID }}
          ANTHROPIC_API_KEY=${{ secrets.ANTHROPIC_API_KEY }}
          HUGGINGFACE_API_TOKEN=${{ secrets.HUGGINGFACE_API_TOKEN }}
          HUGGING_FACE_ACCESS_TOKEN=${{ secrets.HUGGING_FACE_ACCESS_TOKEN }}
          GITHUB_REPOSITORY=${{ secrets.GITHUB_REPOSITORY }}
          IMAGE_TAG=${{ secrets.IMAGE_TAG }}
          EOL

          # --- Restart the FastAPI service ---
          sudo systemctl daemon-reload
          sudo systemctl restart mivaa-pdf-extractor

          # --- Check service status ---
          sudo systemctl status mivaa-pdf-extractor --no-pager
          EOF
