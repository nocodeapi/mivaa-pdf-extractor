name: Deploy FastAPI App with uv

on:
  push:
    branches: [ "main", "production"]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
    # 1. Checkout the repository
    - name: Checkout repository
      uses: actions/checkout@v4

    # 2. Load the private SSH key to connect to the server
    - name: Setup SSH
      uses: webfactory/ssh-agent@v0.9.0
      with:
        ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

    # 3. Deploy the application
    - name: Deploy to server
      run: |
        ssh -o StrictHostKeyChecking=no root@104.248.190.55 << 'EOF'
        set -e

        APP_DIR=/var/www/mivaa-pdf-extractor

        # Store the current branch name from the GitHub Actions context
        # This will be 'production' if triggered by a push to production branch
        DEPLOY_BRANCH="${{ github.ref_name }}"

        # Clone repo if it doesn't exist
        if [ ! -d "$APP_DIR/.git" ]; then
          rm -rf "$APP_DIR"
          git clone https://x-access-token:${{ secrets.GH_PAT }}@github.com/nocodeapi/mivaa-pdf-extractor.git "$APP_DIR"
        fi

        cd "$APP_DIR"

        # Pull latest changes for the specific branch that triggered the workflow
        git fetch origin "$DEPLOY_BRANCH"
        git reset --hard origin/"$DEPLOY_BRANCH"

        # Check if Python 3.9 is available, if not install it
        if ! command -v python3.9 &> /dev/null; then
          echo "Installing Python 3.9..."
          apt update
          apt install -y software-properties-common
          add-apt-repository -y ppa:deadsnakes/ppa
          apt update
          apt install -y python3.9 python3.9-venv python3.9-dev python3.9-distutils
          
          # Install pip for Python 3.9 if needed
          if ! python3.9 -m pip --version &> /dev/null; then
            curl https://bootstrap.pypa.io/get-pip.py | python3.9
          fi
        fi

        # --- DEBUGGING STEP (Keep this for now, just in case) ---
        echo "--- Python version check ---"
        python3.9 --version
        echo "--- Listing files in $APP_DIR after git reset ---"
        ls -la "$APP_DIR"
        echo "-----------------------------------"
        # --- END DEBUGGING STEP ---

        # Write environment variables to .env
        cat > .env <<EOL
        SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}
        SUPABASE_URL=${{ secrets.SUPABASE_URL }}
        SUPABASE_SERVICE_ROLE_KEY=${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}
        OPENAI_ORG_ID=${{ secrets.OPENAI_ORG_ID }}
        OPENAI_PROJECT_ID=${{ secrets.OPENAI_PROJECT_ID }}
        ANTHROPIC_API_KEY=${{ secrets.ANTHROPIC_API_KEY }}
        HUGGINGFACE_API_TOKEN=${{ secrets.HUGGINGFACE_API_TOKEN }}
        HUGGING_FACE_ACCESS_TOKEN=${{ secrets.HUGGING_FACE_ACCESS_TOKEN }}
        GITHUB_REPOSITORY=${{ secrets.GITHUB_REPOSITORY }}
        IMAGE_TAG=${{ secrets.IMAGE_TAG }}
        EOL

        # Create virtual environment with Python 3.9 if it doesn't exist
        if [ ! -d ".venv" ] || [ ! -f ".venv/pyvenv.cfg" ] || ! grep -q "3.9" .venv/pyvenv.cfg; then
          echo "Creating virtual environment with Python 3.9..."
          rm -rf .venv
          
          # Use the installed Python 3.9
          if command -v python3.9 &> /dev/null; then
            PYTHON39_PATH=$(which python3.9)
          elif [ -f "$HOME/.pyenv/versions/3.9.18/bin/python" ]; then
            PYTHON39_PATH="$HOME/.pyenv/versions/3.9.18/bin/python"
          else
            echo "Error: Python 3.9 not found!"
            exit 1
          fi
          
          echo "Using Python at: $PYTHON39_PATH"
          uv venv .venv --python "$PYTHON39_PATH"
        fi

        # Activate virtual environment
        source .venv/bin/activate
        echo "Python version in venv: $(python --version)"

        # Install dependencies using uv pip sync from uv.lock
        echo "Syncing dependencies from uv.lock..."
        uv pip sync uv.lock

        # Verify installation
        echo "Verifying installation..."
        python -c "import sys; print(f'Python version: {sys.version}')"
        python -c "import fastapi; print('FastAPI OK')"
        python -c "import pymupdf; print(f'PyMuPDF {pymupdf.__version__} OK')"
        python -c "import pymupdf4llm; print('pymupdf4llm OK')"

        # Restart the FastAPI service
        echo "Restarting service..."
        sudo systemctl restart mivaa-pdf-extractor
        
        # Check service status
        echo "Service status:"
        sudo systemctl status mivaa-pdf-extractor --no-pager
        EOF